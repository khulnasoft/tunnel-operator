apiVersion: v1
kind: Service
metadata:
  name: {{ include "tunnel-operator.fullname" . }}
  namespace: {{ include "tunnel-operator.namespace" . }}
  labels: {{- include "tunnel-operator.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and (.Values.service.headless) (eq .Values.service.type "ClusterIP") }}
  clusterIP: None
  {{- end }}
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      {{- if not (empty .Values.service.nodePort) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
      protocol: TCP
      appProtocol: {{ .Values.service.metricsAppProtocol }}
  selector: {{- include "tunnel-operator.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}
